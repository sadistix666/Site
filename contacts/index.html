<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Контакты автора сайта о работе Дедом Морозом.">
    <title>Контакты - Дед Мороз</title>
    <link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/src/css/styles.css">
    <script type="module" src="/src/js/main.js"></script>
  </head>
  <body data-page="contacts" data-header-theme="dark">
    <div data-site-header></div>

    <main>
      <section class="hero hero--contacts hero--catalog" aria-labelledby="contacts-title">
        <div class="container grid-12 hero__inner">
          <div class="hero__content hero__content--wide reveal">
            <h1 id="contacts-title">Контакты</h1>
            <p>Основные способы связи по вопросам материалов, структуры сайта и предоставления услуг Деда Мороза.</p>
          </div>
        </div>
      </section>

      <section class="section section--soft section--last" aria-labelledby="write-title">
        <div class="container reveal">
          <h2 id="write-title">Написать автору</h2>
          <div class="contact-grid" data-contact-list></div>
        </div>
      </section>
    </main>

    <div data-site-footer></div>
  </body>
</html>
